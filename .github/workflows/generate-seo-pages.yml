name: Generate public article pages

on:
  push:
    branches: [main]
    paths:
      - articles.json
      - kalkulator.html
      - scripts/generate-seo-pages.js
      - scripts/generate-kalkulator-en.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate localized article pages and sitemap
        run: |
          node scripts/generate-kalkulator-en.js
          node scripts/generate-seo-pages.js
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artikel/ kalkulator-en.html sitemap.xml
          git add index.html
          git diff --cached --quiet || (git commit -m 'seo: publish article pages and sitemap' && git push)
