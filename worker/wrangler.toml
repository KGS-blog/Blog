name = "qco-blog-sync"
main = "src/index.js"
compatibility_date = "2026-10-02"
workers_dev = false

routes = [
  { pattern = "blog-api.qcoid.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "kabar-kopi-members"
database_id = "eed08525-a963-44ee-bca2-7d7f12cec8e1"
migrations_dir = "migrations"

[vars]
GITHUB_OWNER = "KGS-blog"
GITHUB_REPO = "Blog"
GITHUB_BRANCH = "main"
GITHUB_FILE = "articles.json"
PREMIUM_GATE_ENABLED = "false"
CONTRIBUTOR_GATE_ENABLED = "false"
GOOGLE_REDIRECT_URI = "https://blog-api.qcoid.com/api/member/auth/google/callback"
MEMBER_EMAIL_FROM = "Kabar Kopi <no-reply@kabarkopi.qcoid.com>"
